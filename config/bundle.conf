# Settings for scripts/build_bundle.sh and scripts/install_offline.sh (shell format).
BUNDLE_DIR=bundle
PYTHON_BIN=python3
# Silero VAD needs torch. A CPU-only build is enough and keeps the bundle small.
TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
TORCH_REQUIREMENT=torch
# Set to 1 to also bundle the CUDA 12 runtime wheels from requirements-gpu.txt.
INCLUDE_GPU_LIBS=1
VENV_DIR=.venv
